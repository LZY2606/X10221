[package]
name = "fc-lineage"
version = "0.1.0"
edition = "2021"
description = "流式边界室：补偿矩阵、门控系谱与细胞群不确定性 —— 可复核谱系工具"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http-body-util = "0.1"

[dev-dependencies]

[[bin]]
name = "fc-lineage"
path = "src/main.rs"
