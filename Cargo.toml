[package]
name = "flowline"
version = "0.1.0"
edition = "2021"
description = "流式细胞术/补偿/门控谱系复核工具"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1
