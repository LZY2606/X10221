[package]
name = "flow-lineage"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7.9"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
tower = "0.5"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
