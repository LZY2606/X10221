[package]
name = "flowline"
version = "0.1.0"
edition = "2021"
description = "Flow cytometry compensation & gating provenance workbench"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
