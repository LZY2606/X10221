[package]
name = "flowline"
version = "0.1.0"
edition = "2021"
description = "流式细胞术补偿 / 门控谱系复核工具"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]

[[bin]]
name = "flowline"
path = "src/main.rs"

[profile.dev]
opt-level = 0
