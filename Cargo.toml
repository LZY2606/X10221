[package]
name = "flowline"
version = "0.1.0"
edition = "2021"
description = "Flow cytometry compensation/gating lineage review tool with append-only event ledger"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
rusqlite = { version = "0.32", features = ["bundled", "blob"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tower = "0.5"

[dev-dependencies]
serde_json = "1"
