[package]
name = "flow-lineage"
version = "0.1.0"
edition = "2021"
description = "Flow cytometry compensation / gating lineage review tool"

[[bin]]
name = "flow-lineage"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
rusqlite = { version = "0.37", default-features = false, features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }

[profile.test]
opt-level = 1
