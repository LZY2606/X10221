[package]
name = "flow-lineage"
version = "0.1.0"
edition = "2021"

[lib]
name = "flow_lineage"
path = "src/lib.rs"

[[bin]]
name = "flow-lineage"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
