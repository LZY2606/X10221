[package]
name = "flowline"
version = "0.1.0"
edition = "2021"
description = "Flow cytometry compensation / gating lineage review tool with versioned provenance"

[[bin]]
name = "flowline"
path = "src/main.rs"

[[bin]]
name = "fcsgen"
path = "src/bin/fcsgen.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
include_dir = "0.7"

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 1
