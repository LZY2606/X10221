[package]
name = "flow-lineage"
version = "0.1.0"
edition = "2021"
description = "流式细胞术补偿/门控谱系复核工具（来源与解释分离版本化）"

[[bin]]
name = "flow-lineage"
path = "src/main.rs"

[lib]
name = "flow_lineage"
path = "src/lib.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "fs", "io-util"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
anyhow = "1"

[profile.release]
panic = "unwind"
