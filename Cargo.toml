[package]
name = "flowline"
version = "0.1.0"
edition = "2021"
description = "流式细胞术补偿/门控谱系复核工具：版本化来源、反例档案与分支裁定"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
base64 = "0.22"

[lib]
name = "flowline"
path = "src/lib.rs"

[[bin]]
name = "flowline"
path = "src/main.rs"
