[package]
name = "flowline"
version = "0.1.0"
edition = "2021"
description = "流式细胞术/补偿/门控谱系复核工具（反例档案 + 审阅界面）"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 1
