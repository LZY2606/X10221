[package]
name = "flowline"
version = "0.1.0"
edition = "2021"
description = "流式边界室：补偿矩阵、门控系谱与细胞群不确定性的离线谱系复核工具"

[[bin]]
name = "flowline"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower = "0.5"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
