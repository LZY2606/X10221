[package]
name = "flow_provenance"
version = "0.1.0"
edition = "2021"

[lib]
name = "flow_provenance"
path = "src/lib.rs"

[[bin]]
name = "flow_provenance"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["fs"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
