[package]
name = "flow-lineage-review"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "flow-lineage-review"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"

[dev-dependencies]
