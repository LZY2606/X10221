[package]
name = "flowline"
version = "0.1.0"
edition = "2021"
description = "Flow cytometry compensation / gating lineage review tool with versioned provenance"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
axum = { version = "0.7", features = ["query"] }
tower = "0.5"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
quick-xml = "0.36"

[[bin]]
name = "flowline"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
