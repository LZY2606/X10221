[package]
name = "flowline"
version = "0.1.0"
edition = "2021"
description = "流式细胞术补偿 / 门控谱系复核工具（离线案例包：补偿矩阵、门控系谱与细胞群不确定性）"

[[bin]]
name = "flowline"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tower = { version = "0.5", features = ["limit"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = "8"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
thiserror = "1"

[dev-dependencies]

[profile.dev]
opt-level = 0
