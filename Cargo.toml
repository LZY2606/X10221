[package]
name = "flowprov"
version = "0.1.0"
edition = "2021"
description = "Flow cytometry compensation / gating provenance workbench"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"
tower = "0.5"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
