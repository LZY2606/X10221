[package]
name = "flowbound"
version = "0.1.0"
edition = "2021"
description = "Flow-boundary chamber: compensation matrix, gating lineage and cell-population uncertainty provenance"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
ureq = "3"
