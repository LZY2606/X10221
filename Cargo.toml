[package]
name = "flow_lineage"
version = "0.1.0"
edition = "2021"
description = "流式边界室：补偿矩阵、门控系谱与细胞群不确定性 —— 流式细胞术/补偿/门控谱系复核工具"

[lib]
name = "flow_lineage"
path = "src/lib.rs"

[[bin]]
name = "flow_lineage"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
