[package]
name = "flow-lineage"
version = "0.1.0"
edition = "2021"
description = "Flow cytometry compensation & gating lineage review workbench"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
tempfile = "3"
