[package]
name = "flowline"
version = "0.1.0"
edition = "2021"
description = "流式边界室：补偿矩阵、门控系谱与细胞群不确定性（离线复核案例）"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "flowline"
path = "src/main.rs"

[profile.release]
panic = "unwind"
