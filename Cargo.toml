[package]
name = "flow-lineage"
version = "0.1.0"
edition = "2021"
description = "流式细胞术补偿/门控谱系复核工具：原始信号→补偿→变换→门控群的可溯源事件账本"

[[bin]]
name = "flow-lineage"
path = "src/main.rs"

[[bin]]
name = "make-case-pack"
path = "src/bin/make_case_pack.rs"
required-features = []

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
include_dir = "0.7"
anyhow = "1"
thiserror = "2"

[dev-dependencies]
