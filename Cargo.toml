[package]
name = "flow_lineage"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
rusqlite = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower = "0.5"

[profile.test]
opt-level = 0
