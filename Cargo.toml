[package]
name = "flow-boundary-chamber"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7.9"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
