[package]
name = "flowline"
version = "0.1.0"
edition = "2021"
description = "流式边界室：补偿矩阵、门控系谱与细胞群不确定性 —— 离线可复核谱系工具"

[[bin]]
name = "flowline"
path = "src/main.rs"

[lib]
name = "flowline"
path = "src/lib.rs"

[dependencies]
axum = "0.7.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
thiserror = "2"
once_cell = "1"
flate2 = "1"
tempfile = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 2
