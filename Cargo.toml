[package]
name = "flowline"
version = "0.1.0"
edition = "2021"
description = "流式细胞术补偿/门控谱系离线复核工具"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[[bin]]
name = "flowline"
path = "src/main.rs"
