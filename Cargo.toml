[package]
name = "flow-lineage"
version = "0.1.0"
edition = "2021"
description = "流式细胞术补偿/门控谱系复核工具：来源与解释分开版本化、事件溯源、失效传播与分支裁定"

[lib]
name = "flow_lineage"
path = "src/lib.rs"

[[bin]]
name = "flow-lineage"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
