[package]
name = "flow-lineage-ledger"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["form", "http1", "matched-path", "query", "tokio", "tower-log"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.11"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6.11", default-features = false, features = ["trace"] }

[dev-dependencies]
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["client", "http1"] }
