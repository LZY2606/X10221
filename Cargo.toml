[package]
name = "fcgsb"
version = "0.1.0"
edition = "2021"
description = "Flow-cytometry compensation / gating-lineage review chamber"
build = "build.rs"

[lib]
name = "fcgsb"
path = "src/lib.rs"

[[bin]]
name = "fcgsb"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
sha2 = "0.10"
anyhow = "1"
thiserror = "2"
