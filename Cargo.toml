[package]
name = "flowline"
version = "0.1.0"
edition = "2021"
description = "流式细胞术/补偿/门控谱系复核工具（含流式边界室反例档案）"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
