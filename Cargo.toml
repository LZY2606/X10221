[package]
name = "flow_lineage_review"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-listener = "0.3"

[dev-dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
