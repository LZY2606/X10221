[package]
name = "flowline"
version = "0.1.0"
edition = "2021"
description = "Offline flow-cytometry compensation / gating lineage review tool"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"

[dev-dependencies]
ureq = { version = "2", features = ["json"] }
tempfile = "3"
sha1 = "0.10"
base64 = "0.22"

[[bin]]
name = "flowline"
path = "src/main.rs"
