[package]
name = "flowline"
version = "0.1.0"
edition = "2021"

[lib]
name = "flowline"
path = "src/lib.rs"

[[bin]]
name = "flowline"
path = "src/bin/server.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = "0.5"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"
