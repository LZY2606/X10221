[package]
name = "flowline"
version = "0.1.0"
edition = "2021"
description = "流式边界室：FCS 补偿矩阵、门控系谱与细胞群不确定性的版本化复核工具"

[dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "json", "query", "form", "matched-path"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"] }
tower = "0.5"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
thiserror = "1"
mime_guess = "2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }

[[bin]]
name = "flowline"
path = "src/main.rs"
