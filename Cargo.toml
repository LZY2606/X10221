[package]
name = "flowline"
version = "0.1.0"
edition = "2021"
description = "流式细胞术补偿/门控谱系离线复核工具"

[[bin]]
name = "flowline"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tower = "0.5"
tower-layer = "0.3"

[dev-dependencies]
serde_json = "1"
