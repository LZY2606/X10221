[package]
name = "flow-lineage"
version = "0.1.0"
edition = "2021"
description = "流式边界室：补偿矩阵、门控系谱与细胞群不确定性的版本化复核工具"

[lib]
name = "flow_lineage"
path = "src/lib.rs"

[[bin]]
name = "flow-lineage"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
include_dir = "0.7"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"

[profile.dev]
opt-level = 0

[[example]]
name = "gen_case"
path = "examples/gen_case.rs"
