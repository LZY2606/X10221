[package]
name = "flowline"
version = "0.1.0"
edition = "2021"
description = "Flow cytometry compensation & gating lineage audit workbench"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[[bin]]
name = "flowline"
path = "src/main.rs"
