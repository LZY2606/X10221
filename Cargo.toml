[package]
name = "flowline"
version = "0.1.0"
edition = "2021"
description = "流式细胞术补偿/门控谱系复核工具（边界室离线案例）"

[lib]
name = "flowline"
path = "src/lib.rs"

[[bin]]
name = "flowline"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
tempfile = "3"

[profile.test]
opt-level = 1
