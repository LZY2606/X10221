[package]
name = "lineage-flow"
version = "0.1.0"
edition = "2021"
description = "流式边界室：补偿矩阵、门控系谱与细胞群不确定性的离线复核工具"

[[bin]]
name = "lineage-flow"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.37", features = ["bundled"] }
nalgebra = "0.33"
clap = { version = "4", features = ["derive"] }
include_dir = "0.7"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
thiserror = "2"

[dev-dependencies]
# 端到端流程测试仅依赖标准库 + 本 crate 公共 API
