[package]
name = "flowline"
version = "0.1.0"
edition = "2021"
description = "流式边界室：流式细胞术补偿/门控谱系复核工具"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
