[package]
name = "flowline"
version = "0.1.0"
edition = "2021"
description = "流式边界室：补偿矩阵、门控系谱与细胞群不确定性 —— 来源/解释分离的可复核谱系工具"

[lib]
name = "flowline"
path = "src/lib.rs"

[[bin]]
name = "flowline"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "fs"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["set-header"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
include_dir = "0.7"
thiserror = "1"

[dev-dependencies]
chromiumoxide = { version = "0.9", default-features = false, features = ["tokio-runtime"] }
tempfile = "3"
futures = "0.3"
