[package]
name = "flowline"
version = "0.1.0"
edition = "2021"
description = "Flow cytometry compensation / gating lineage review workbench"

[lib]
name = "flowline"
path = "src/lib.rs"

[[bin]]
name = "flowline"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
tower = "0.5"

[dev-dependencies]
reqwest = { version = "0.13", features = ["blocking", "json"] }
