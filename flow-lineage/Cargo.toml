[package]
name = "flow-lineage"
version = "0.1.0"
edition = "2021"

[lib]
name = "flow_lineage"
path = "src/lib.rs"

[[bin]]
name = "flow-lineage"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.37", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
tower = "0.5"

[dev-dependencies]
tempfile = "3"
