[package]
name = "flow-lineage"
version = "0.1.0"
edition = "2021"
description = "Flow cytometry compensation & gating lineage review chamber"

[[bin]]
name = "flow-lineage"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
include_dir = "0.7"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 0
